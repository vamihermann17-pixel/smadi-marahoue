name: Mise à jour du SMADI

on:
  schedule:
    - cron: "0 6 12 * *"   # le 12 de chaque mois à 6 h UTC (6 h à Abidjan)
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  smadi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Calculer le SMADI (Google Earth Engine)
        # Sur un simple push, on ne recalcule que si aucune donnée n'a encore été produite
        if: github.event_name != 'push' || hashFiles('docs/smadi_marahoue.json') == ''
        id: calcul
        continue-on-error: true   # en cas de panne d'Earth Engine, on garde le calcul précédent
        working-directory: scripts
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          EE_PROJECT: ${{ vars.EE_PROJECT }}
          SM_SOURCE: ${{ vars.SM_SOURCE || 'era5' }}
          OUTDIR: ../docs
        run: |
          if [ -z "$EE_SERVICE_ACCOUNT_KEY" ]; then
            echo "::error::Secret EE_SERVICE_ACCOUNT_KEY absent : voir le README (Connexion à Earth Engine)."
            exit 1
          fi
          for essai in 1 2 3; do
            python smadi_marahoue.py && exit 0
            echo "Échec de l'essai $essai, nouvel essai dans 120 s"; sleep 120
          done
          exit 1

      - name: Enregistrer les nouvelles données
        if: steps.calcul.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.json docs/*.csv scripts/cache_smadi
          git diff --cached --quiet || git commit -m "SMADI jusqu'à $(python -c "import json;print(json.load(open('docs/smadi_marahoue.json'))['dernier_mois']['m'])")"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  publication:
    needs: smadi
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
